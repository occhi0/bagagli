<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizza i bagagli</title>
<style>
  :root{
    --ink:#22322c;
    --paper:#f6f3ec;
    --line:#cfc6b4;
    --moss:#4c6b52;
    --moss-dark:#37503c;
    --clay:#a8622f;
    --card:#ffffff;
    --muted:#7c7466;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    background:var(--paper);
    color:var(--ink);
    padding:32px 18px 80px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:28px;}
  h1{
    font-size:2rem;
    margin:0 0 6px;
    letter-spacing:0.2px;
    font-weight:600;
  }
  .subtitle{
    color:var(--muted);
    font-size:0.98rem;
    margin:0;
  }
  .progress-block{
    margin-top:22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
  }
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
    font-size:0.92rem;
    color:var(--muted);
  }
  .progress-count{
    font-size:1.05rem;
    color:var(--ink);
    font-weight:600;
  }
  .bar-outer{
    height:8px;
    background:#e9e4d6;
    border-radius:6px;
    overflow:hidden;
  }
  .bar-inner{
    height:100%;
    background:var(--moss);
    width:0%;
    transition:width 0.35s ease;
  }

  .add-row{
    display:flex;
    gap:8px;
    margin:26px 0 18px;
  }
  .add-row select, .add-row input[type=text]{
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink);
  }
  .add-row select{flex:0 0 150px;}
  .add-row input[type=text]{flex:1;min-width:0;}
  .add-row button{
    flex:0 0 auto;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:var(--moss);
    color:#fff;
    font-family:inherit;
    font-size:0.95rem;
    cursor:pointer;
  }
  .add-row button:hover{background:var(--moss-dark);}

  .category{
    margin-bottom:22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .cat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 16px;
    background:#efe9db;
    border-bottom:1px solid var(--line);
  }
  .cat-title{
    font-weight:600;
    font-size:1.02rem;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cat-count{
    font-size:0.85rem;
    color:var(--muted);
    font-weight:400;
  }
  .cat-header-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .del-cat{
    border:none;
    background:none;
    color:var(--muted);
    font-size:1rem;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
  }
  .del-cat:hover{color:var(--clay);}
  ul.items{
    list-style:none;
    margin:0;
    padding:6px 0;
  }
  li.item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 16px;
    border-bottom:1px solid #f0ece1;
  }
  li.item:last-child{border-bottom:none;}
  li.item input[type=checkbox]{
    width:18px;height:18px;
    accent-color:var(--moss);
    flex:0 0 auto;
    cursor:pointer;
  }
  li.item label{
    flex:1;
    cursor:pointer;
    font-size:0.98rem;
  }
  li.item.checked label{
    text-decoration:line-through;
    color:var(--muted);
  }
  li.item .remove{
    border:none;
    background:none;
    color:var(--muted);
    font-size:1.1rem;
    cursor:pointer;
    padding:2px 6px;
    line-height:1;
  }
  li.item .remove:hover{color:var(--clay);}
  .empty-cat{
    padding:14px 16px;
    color:var(--muted);
    font-size:0.9rem;
    font-style:italic;
  }

  footer{
    margin-top:30px;
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
  }
  .reset-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    font-family:inherit;
    font-size:0.85rem;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  .reset-btn:hover{color:var(--clay);border-color:var(--clay);}

  @media (max-width:420px){
    .add-row{flex-wrap:wrap;}
    .add-row select{flex:1 1 100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bagagli da preparare</h1>
    <p class="subtitle">Spunta man mano che metti in valigia. Le modifiche si salvano automaticamente su questo dispositivo.</p>
  </header>

  <div class="progress-block">
    <div class="progress-row">
      <span>Avanzamento</span>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>
    <div class="bar-outer"><div class="bar-inner" id="barInner"></div></div>
  </div>

  <div class="add-row">
    <select id="catSelect"></select>
    <input type="text" id="newItemInput" placeholder="Aggiungi un oggetto…">
    <button id="addBtn">Aggiungi</button>
  </div>

  <div class="add-row">
    <input type="text" id="newCatInput" placeholder="Nome nuova categoria…">
    <button id="addCatBtn">Nuova categoria</button>
  </div>

  <div id="categories"></div>

  <footer>
    <button id="resetBtn" class="reset-btn">Ripristina lista di partenza</button>
  </footer>
</div>

<script>
  const STORAGE_KEY = 'bagagli-checklist-v1';

  function defaultData() {
    return [
      { name: "Documenti", items: [
        { text: "Carta d'identità / passaporto", checked: false },
        { text: "Biglietti / prenotazioni", checked: false },
        { text: "Assicurazione di viaggio", checked: false },
      ]},
      { name: "Abbigliamento", items: [
        { text: "Magliette", checked: false },
        { text: "Pantaloni", checked: false },
        { text: "Biancheria intima", checked: false },
        { text: "Calzini", checked: false },
        { text: "Pigiama", checked: false },
        { text: "Giacca / felpa", checked: false },
      ]},
      { name: "Toiletries", items: [
        { text: "Spazzolino e dentifricio", checked: false },
        { text: "Shampoo / bagnoschiuma", checked: false },
        { text: "Rasoio", checked: false },
        { text: "Farmaci personali", checked: false },
      ]},
      { name: "Elettronica", items: [
        { text: "Caricabatterie telefono", checked: false },
        { text: "Powerbank", checked: false },
        { text: "Adattatore di corrente", checked: false },
      ]},
      { name: "Varie", items: [
        { text: "Occhiali da sole", checked: false },
        { text: "Borraccia", checked: false },
      ]},
    ];
  }

  let data = defaultData();

  function loadData() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) data = parsed;
      }
    } catch (e) {
      console.warn('Impossibile leggere i dati salvati:', e);
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn('Impossibile salvare i dati:', e);
    }
  }

  loadData();

  const categoriesEl = document.getElementById('categories');
  const catSelect = document.getElementById('catSelect');
  const newItemInput = document.getElementById('newItemInput');
  const addBtn = document.getElementById('addBtn');
  const newCatInput = document.getElementById('newCatInput');
  const addCatBtn = document.getElementById('addCatBtn');
  const progressCount = document.getElementById('progressCount');
  const barInner = document.getElementById('barInner');

  function render() {
    // Aggiorna il select delle categorie
    catSelect.innerHTML = '';
    data.forEach((cat, ci) => {
      const opt = document.createElement('option');
      opt.value = ci;
      opt.textContent = cat.name;
      catSelect.appendChild(opt);
    });

    const noCats = data.length === 0;
    catSelect.disabled = noCats;
    newItemInput.disabled = noCats;
    addBtn.disabled = noCats;
    newItemInput.placeholder = noCats ? 'Crea prima una categoria…' : 'Aggiungi un oggetto…';

    // Costruisce le categorie
    categoriesEl.innerHTML = '';
    if (noCats) {
      const empty = document.createElement('p');
      empty.className = 'empty-cat';
      empty.style.padding = '4px 2px';
      empty.textContent = 'Nessuna categoria. Creane una qui sotto per iniziare.';
      categoriesEl.appendChild(empty);
    }
    let total = 0, done = 0;

    data.forEach((cat, ci) => {
      const catDiv = document.createElement('div');
      catDiv.className = 'category';

      const header = document.createElement('div');
      header.className = 'cat-header';
      const catDone = cat.items.filter(i => i.checked).length;
      header.innerHTML = `
        <span class="cat-title">${cat.name}</span>
        <span class="cat-header-right">
          <span class="cat-count">${catDone} / ${cat.items.length}</span>
          <button class="del-cat" title="Elimina categoria">✕</button>
        </span>
      `;
      header.querySelector('.del-cat').addEventListener('click', () => {
        if (cat.items.length > 0) {
          const ok = confirm(`Eliminare "${cat.name}" e i suoi ${cat.items.length} oggetti?`);
          if (!ok) return;
        }
        data.splice(ci, 1);
        saveData();
        render();
      });
      catDiv.appendChild(header);

      if (cat.items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-cat';
        empty.textContent = 'Nessun oggetto ancora in questa categoria.';
        catDiv.appendChild(empty);
      } else {
        const ul = document.createElement('ul');
        ul.className = 'items';
        cat.items.forEach((item, ii) => {
          total++;
          if (item.checked) done++;
          const li = document.createElement('li');
          li.className = 'item' + (item.checked ? ' checked' : '');
          const cbId = `item-${ci}-${ii}`;
          li.innerHTML = `
            <input type="checkbox" id="${cbId}" ${item.checked ? 'checked' : ''}>
            <label for="${cbId}">${item.text}</label>
            <button class="remove" title="Rimuovi">✕</button>
          `;
          li.querySelector('input').addEventListener('change', () => {
            item.checked = !item.checked;
            saveData();
            render();
          });
          li.querySelector('.remove').addEventListener('click', () => {
            cat.items.splice(ii, 1);
            saveData();
            render();
          });
          ul.appendChild(li);
        });
        catDiv.appendChild(ul);
      }

      categoriesEl.appendChild(catDiv);
    });

    progressCount.textContent = `${done} / ${total}`;
    barInner.style.width = total ? `${(done / total) * 100}%` : '0%';
  }

  addBtn.addEventListener('click', () => {
    if (data.length === 0) return;
    const text = newItemInput.value.trim();
    if (!text) return;
    const ci = parseInt(catSelect.value, 10);
    data[ci].items.push({ text, checked: false });
    newItemInput.value = '';
    saveData();
    render();
    newItemInput.focus();
  });

  newItemInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addBtn.click();
  });

  addCatBtn.addEventListener('click', () => {
    const name = newCatInput.value.trim();
    if (!name) return;
    data.push({ name, items: [] });
    newCatInput.value = '';
    saveData();
    render();
    newCatInput.focus();
  });

  newCatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCatBtn.click();
  });

  const resetBtn = document.getElementById('resetBtn');
  resetBtn.addEventListener('click', () => {
    const ok = confirm('Ripristinare la lista di partenza? Tutte le modifiche andranno perse.');
    if (!ok) return;
    data = defaultData();
    saveData();
    render();
  });

  render();
</script>
</body>
</html>
